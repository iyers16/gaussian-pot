name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/gaussian-pot-frontend
  BACKEND_IMAGE:  ghcr.io/${{ github.repository_owner }}/gaussian-pot-backend

jobs:
  # ─── Tests ──────────────────────────────────────────────────────────────────

  test-backend:
    name: Go unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run game logic tests
        working-directory: backend
        run: go test ./internal/game/... -v -race

  typecheck-frontend:
    name: TypeScript type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: ./node_modules/.bin/tsc --noEmit

  # ─── Builds ─────────────────────────────────────────────────────────────────

  build-frontend:
    name: Build & push frontend image
    runs-on: ubuntu-latest
    needs: typecheck-frontend
    permissions:
      contents: read
      packages: write
    outputs:
      changed: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Check changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'docker-compose.yml'
              - '.github/workflows/deploy.yml'

      - name: Log in to GHCR
        if: steps.filter.outputs.frontend == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.filter.outputs.frontend == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        if: steps.filter.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.FRONTEND_IMAGE }}:cache,mode=max

  build-backend:
    name: Build & push backend image
    runs-on: ubuntu-latest
    needs: test-backend
    permissions:
      contents: read
      packages: write
    outputs:
      changed: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4

      - name: Check changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose.yml'
              - '.github/workflows/deploy.yml'

      - name: Log in to GHCR
        if: steps.filter.outputs.backend == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.filter.outputs.backend == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        if: steps.filter.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.BACKEND_IMAGE }}:cache,mode=max

  # ─── Deploy ─────────────────────────────────────────────────────────────────

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key:      ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd ~/gaussian-pot
            git pull origin main
            docker compose pull
            docker compose up -d
            docker image prune -f
